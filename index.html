<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍀 행운 메이트 : 오늘의 행운 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #f3e5f5);
      font-family: Arial, sans-serif;
      color: #333;
    }
    .container {
      width: min(600px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 26px; color: #2b7a3a; }
    .subtitle { text-align: center; color: #777; margin-bottom: 24px; font-size: 14px; }
    
    /* ✍️ 이름 입력 상자 스타일 */
    .name-box { background: #f9f9f9; padding: 18px; border-radius: 16px; text-align: left; margin-bottom: 20px; border: 1px solid #edf1f5; }
    .name-input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; outline: none; }
    .name-input:focus { border-color: #4CAF50; box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.15); }

    .chat-box { display: flex; flex-direction: column; gap: 14px; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s;
    }
    .submit-btn:hover { transform: translateY(-2px); background-color: #43a047; }
    .submit-btn:disabled { cursor: not-allowed; opacity: 0.6; transform: none; }
    
    .ai-card {
      background: #fbf7ff;
      border-left: 5px solid #9C27B0;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #edf1f5;
      border-left: 5px solid #9C27B0;
      display: none;
    }
    .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed #e0e0e0; padding-bottom: 10px; }
    .card-title { margin: 0; font-size: 18px; color: #9C27B0; }
    .tts-btn { background-color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .ai-text { line-height: 1.8; font-size: 16px; margin: 0; white-space: pre-line; color: #444; }
    .status { min-height: 24px; color: #666; font-size: 13px; text-align: center; margin-top: 5px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍀 행운 메이트</h1>
    <div class="subtitle">이름을 입력하고 오늘의 행운 카드를 뽑아보세요!</div>

    <div class="name-box">
      <label style="font-size: 14px; font-weight: bold; color: #555;">👤 당신의 이름을 알려주세요</label>
      <input type="text" id="user-name-input" class="name-input" placeholder="이름 또는 닉네임을 입력하세요">
    </div>

    <div class="chat-box">
      <form id="fortune-form">
        <button type="submit" id="submit-btn" class="submit-btn">✨ 오늘의 행운 뽑기</button>
      </form>

      <div id="status" class="status"></div>

      <section id="ai-card" class="card ai-card">
        <div class="ai-header">
          <h3 class="card-title">🔮 AI 점술가 럭키의 조언</h3>
          <button id="tts-btn" class="tts-btn">🔊 목소리로 듣기</button>
        </div>
        <p id="ai-text" class="ai-text"></p>
      </section>
    </div>
  </div>

  <script>
    // ✅ 내 Google Apps Script 웹 앱 URL 주소
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1zdR3hsVw8Xv0Tg02tTXCH5w_XXloYwWHpCNkS_iWcGELOP_eYaTpCfRAJjsrCh3T/exec';

    const userNameInput = document.getElementById('user-name-input');
    const fortuneForm = document.getElementById('fortune-form');
    const submitBtn = document.getElementById('submit-btn');
    const aiCard = document.getElementById('ai-card');
    const aiText = document.getElementById('ai-text');
    const statusBox = document.getElementById('status');
    const ttsBtn = document.getElementById('tts-btn');

    // 예전에 입력한 이름이 브라우저에 남아있으면 자동으로 채워줌
    if (localStorage.getItem('fortune_user_name')) {
      userNameInput.value = localStorage.getItem('fortune_user_name');
    }

    // [오늘의 행운 뽑기] 클릭 시 작동
    fortuneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const userName = userNameInput.value.trim();
      if (!userName) {
        alert("⚠️ 이름을 먼저 입력해 주세요!");
        return;
      }

      // 이름 기억하기
      localStorage.setItem('fortune_user_name', userName);

      try {
        setLoading(true);
        aiCard.style.display = 'none';
        statusBox.textContent = `🔮 ${userName}님의 기운을 담아 운세를 뽑는 중...`;

        // Apps Script 서버로 이름과 함께 운세 요청 전송
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            question: "내 오늘의 행운 카드를 뽑아줘!",
            userEmail: "N/A", // 구글 로그인 대신 입력형이므로 이메일은 비워둠
            userName: userName
          })
        });

        const data = await response.json();

        if (data.error) {
          throw new Error(data.error);
        }
