<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍀 행운 메이트 : 오늘의 행운 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #f3e5f5);
      font-family: Arial, sans-serif;
      color: #333;
    }
    .container {
      width: min(600px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 26px; color: #2b7a3a; }
    .subtitle { text-align: center; color: #777; margin-bottom: 24px; font-size: 14px; }
    
    /* 🔐 로컬 간이 로그인 구역 스타일 */
    .auth-box { background: #f9f9f9; padding: 18px; border-radius: 16px; text-align: left; margin-bottom: 20px; border: 1px solid #edf1f5; }
    .auth-input { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .auth-input:focus { border-color: #4285F4; }
    .login-btn { width: 100%; background-color: #4285F4; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; text-align: center; }
    .login-btn:hover { background-color: #357ae8; }
    
    .user-info { font-weight: bold; color: #2b7a3a; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; }
    .logout-btn { background: #fff; border: 1px solid #ccc; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .logout-btn:hover { background: #f5f5f5; }

    .chat-box { display: flex; flex-direction: column; gap: 14px; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s;
    }
    .submit-btn:hover { transform: translateY(-2px); background-color: #43a047; }
    .submit-btn:disabled { cursor: not-allowed; opacity: 0.6; transform: none; background-color: #cccccc; }
    
    .ai-card {
      background: #fbf7ff;
      border-left: 5px solid #9C27B0;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #edf1f5;
      display: none;
    }
    .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed #e0e0e0; padding-bottom: 10px; }
    .card-title { margin: 0; font-size: 18px; color: #9C27B0; }
    .tts-btn { background-color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .ai-text { line-height: 1.8; font-size: 16px; margin: 0; white-space: pre-line; color: #444; }
    .status { min-height: 24px; color: #666; font-size: 13px; text-align: center; margin-top: 5px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍀 행운 메이트</h1>
    <div class="subtitle">계정 등록 후 오늘의 행운 카드를 뽑아보세요!</div>

    <div class="auth-box">
      <div id="login-section">
        <label style="font-size: 13px; font-weight: bold; color: #555;">📧 구글 이메일 주소</label>
        <input type="email" id="local-email" class="auth-input" placeholder="예: 24614@daehyun.hs.kr">
        
        <label style="font-size: 13px; font-weight: bold; color: #555;">👤 사용할 닉네임</label>
        <input type="text" id="local-name" class="auth-input" placeholder="예: 홍길동">
        
        <button id="local-login-btn" class="login-btn">🔐 계정 등록 및 로그인</button>
      </div>
      <div id="user-section" class="hidden">
        <div class="user-info">
          <div>
            <span id="user-display-name" style="display:block; font-size:15px;">👋 홍길동님</span>
            <span id="user-display-email" style="display:block; font-size:12px; color:#666; font-weight:normal;">24614@daehyun.hs.kr</span>
          </div>
          <button id="local-logout-btn" class="logout-btn">로그아웃</button>
        </div>
      </div>
    </div>

    <div class="chat-box">
      <form id="fortune-form">
        <button type="submit" id="submit-btn" class="submit-btn" disabled>🔒 로그인이 필요합니다</button>
      </form>

      <div id="status" class="status"></div>

      <section id="ai-card" class="card ai-card">
        <div class="ai-header">
          <h3 class="card-title">🔮 AI 점술가 럭키의 조언</h3>
          <button id="tts-btn" class="tts-btn">🔊 목소리로 듣기</button>
        </div>
        <p id="ai-text" class="ai-text"></p>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 본인의 실시간 데이터베이스 연결
    const firebaseConfig = {
      databaseURL: "https://test-47ff6-default-rtdb.firebaseio.com"
    };

    // 내 OpenAI 전송용 구글 앱스 스크립트 주소
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1zdR3hsVw8Xv0Tg02tTXCH5w_XXloYwWHpCNkS_iWcGELOP_eYaTpCfRAJjsrCh3T/exec';

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const loginSection = document.getElementById('login-section');
    const userSection = document.getElementById('user-section');
    const loginBtn = document.getElementById('local-login-btn');
    const logoutBtn = document.getElementById('local-logout-btn');
    const emailInput = document.getElementById('local-email');
    const nameInput = document.getElementById('local-name');
    const userDisplayName = document.getElementById('user-display-name');
    const userDisplayEmail = document.getElementById('user-display-email');
    const fortuneForm = document.getElementById('fortune-form');
    const submitBtn = document.getElementById('submit-btn');
    const aiCard = document.getElementById('ai-card');
    const aiText = document.getElementById('ai-text');
    const statusBox = document.getElementById('status');
    const ttsBtn = document.getElementById('tts-btn');

    let currentUser = null;

    // 브라우저 캐시에서 기존 로컬 로그인 세션 확인
    function checkLoginStatus() {
      const savedUser = localStorage.getItem('local_fortune_user');
      if (savedUser) {
        currentUser = JSON.parse(savedUser);
      }
      updateUI();
    }

    function updateUI() {
      if (currentUser) {
        loginSection.classList.add('hidden');
        userSection.classList.remove('hidden');
        userDisplayName.textContent = `👋 ${currentUser.name}님 환영합니다!`;
        userDisplayEmail.textContent = currentUser.email;
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ 오늘의 행운 뽑기';
      } else {
        loginSection.classList.remove('hidden');
        userSection.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = '🔒 로그인이 필요합니다';
        aiCard.style.display = 'none';
      }
    }

    // 외부 승인 없는 수동 로컬 로그인 기능 구현
    loginBtn.addEventListener('click', () => {
      const email = emailInput.value.trim();
      const name = nameInput.value.trim();

      if (!email || !name) {
        alert("⚠️ 이메일과 닉네임을 모두 입력해 주세요!");
        return;
      }

      if (!email.includes('@')) {
        alert("⚠️ 올바른 이메일 형식을 입력해 주세요!");
        return;
      }

      // 유저 고유 데이터 로컬 생성
      currentUser = {
        uid: "local_" + Math.random().toString(36).substring(2, 11),
        email: email,
        name: name
      };

      localStorage.setItem('local_fortune_user', JSON.stringify(currentUser));
      updateUI();
      statusBox.textContent = "로컬 계정 등록 성공!";
    });

    // 로그아웃
    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('local_fortune_user');
      currentUser = null;
      updateUI();
      statusBox.textContent = "로그아웃 되었습니다.";
    });

    // 운세 가동 및 실시간 데이터베이스 저장
    fortuneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      try {
        setLoading(true);
        aiCard.style.display = 'none';
        statusBox.textContent = '🔮 AI 점술가 럭키가 우주의 기운을 모으는 중...';

        // 구글 서버로 전송하여 OpenAI 답변 획득
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ 
            question: "내 오늘의 행운 카드를 뽑아줘!",
            userName: currentUser.name // 내 로컬 닉네임을 GPT 시스템으로 전송
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        const answerText = data.answer;
        aiText.textContent = answerText;
        aiCard.style.display = 'block';

        statusBox.textContent = '💾 Realtime Database에 운세 내역 기록 중...';
        
        // 📥 저장할 때 입력받은 구글 이메일 주소와 닉네임을 함께 DB에 저장합니다.
        const fortunesRef = ref(database, 'fortunes');
        const newRecordRef = push(fortunesRef);
        
        await set(newRecordRef, {
          uid: currentUser.uid,
          email: currentUser.email, // 적어둔 이메일 주소 매칭
          name: currentUser.name,   // 적어둔 닉네임 매칭
          fortuneResult: answerText,
          createdAt: new Date().toLocaleString()
        });

        statusBox.textContent = '🔮 오늘의 행운 뽑기 및 Realtime DB 저장 완료!';

      } catch (error) {
        console.error(error);
        aiText.textContent = '문제가 발생했습니다.\n원인: ' + error.message;
        aiCard.style.display = 'block';
        statusBox.textContent = '요청 실패';
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? '🔮 기운을 모으는 중...' : '✨ 오늘의 행운 뽑기';
    }

    ttsBtn.addEventListener('click', () => {
      const textToSpeak = aiText.textContent;
      if (!textToSpeak) return;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ko-KR';
      window.speechSynthesis.speak(utterance);
    });

    // 앱 실행 시 로컬 유저 로그인 검사 실행
    checkLoginStatus();
  </script>
</body>
</html>
