<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍀 행운 메이트 : 오늘의 행운 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #f3e5f5);
      font-family: Arial, sans-serif;
      color: #333;
    }
    .container {
      width: min(600px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 26px; color: #2b7a3a; }
    .subtitle { text-align: center; color: #777; margin-bottom: 24px; font-size: 14px; }
    
    .auth-box { background: #f9f9f9; padding: 18px; border-radius: 16px; text-align: center; margin-bottom: 20px; border: 1px solid #edf1f5; }
    .login-btn { background-color: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .login-btn:hover { background-color: #357ae8; }
    .user-info { font-weight: bold; color: #2b7a3a; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logout-btn { background: #fff; border: 1px solid #ccc; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .logout-btn:hover { background: #f5f5f5; }

    .chat-box { display: flex; flex-direction: column; gap: 14px; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s;
    }
    .submit-btn:hover { transform: translateY(-2px); background-color: #43a047; }
    .submit-btn:disabled { cursor: not-allowed; opacity: 0.6; transform: none; background-color: #cccccc; }
    
    .ai-card {
      background: #fbf7ff;
      border-left: 5px solid #9C27B0;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #edf1f5;
      display: none;
    }
    .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed #e0e0e0; padding-bottom: 10px; }
    .card-title { margin: 0; font-size: 18px; color: #9C27B0; }
    .tts-btn { background-color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .ai-text { line-height: 1.8; font-size: 16px; margin: 0; white-space: pre-line; color: #444; }
    .status { min-height: 24px; color: #666; font-size: 13px; text-align: center; margin-top: 5px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍀 행운 메이트</h1>
    <div class="subtitle">구글 로그인 후 오늘의 행운 카드를 뽑아보세요!</div>

    <div class="auth-box">
      <div id="login-section">
        <p style="margin: 0 0 12px 0; font-size: 14px; color: #555;">로그인하시면 나만의 운세 기록이 Realtime DB에 보관됩니다.</p>
        <button id="google-login-btn" class="login-btn">🌐 구글 계정으로 로그인</button>
      </div>
      <div id="user-section" class="hidden">
        <div class="user-info">
          <span id="user-display-name">👋 인증 확인 중...</span>
          <button id="google-logout-btn" class="logout-btn">로그아웃</button>
        </div>
      </div>
    </div>

    <div class="chat-box">
      <form id="fortune-form">
        <button type="submit" id="submit-btn" class="submit-btn" disabled>🔒 로그인이 필요합니다</button>
      </form>

      <div id="status" class="status"></div>

      <section id="ai-card" class="card ai-card">
        <div class="ai-header">
          <h3 class="card-title">🔮 AI 점술가 럭키의 조언</h3>
          <button id="tts-btn" class="tts-btn">🔊 목소리로 듣기</button>
        </div>
        <p id="ai-text" class="ai-text"></p>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Firebase Realtime DB 직접 연동 세팅
    const firebaseConfig = {
      databaseURL: "https://test-47ff6-default-rtdb.firebaseio.com"
    };

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1zdR3hsVw8Xv0Tg02tTXCH5w_XXloYwWHpCNkS_iWcGELOP_eYaTpCfRAJjsrCh3T/exec';

    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    const loginSection = document.getElementById('login-section');
    const userSection = document.getElementById('user-section');
    const loginBtn = document.getElementById('google-login-btn');
    const logoutBtn = document.getElementById('google-logout-btn');
    const userDisplayName = document.getElementById('user-display-name');
    const fortuneForm = document.getElementById('fortune-form');
    const submitBtn = document.getElementById('submit-btn');
    const aiCard = document.getElementById('ai-card');
    const aiText = document.getElementById('ai-text');
    const statusBox = document.getElementById('status');
    const ttsBtn = document.getElementById('tts-btn');

    let currentUser = null;

    // 💡 Firebase 도메인 제한을 우회하기 위해 구글 인증 인프라를 직접 사용합니다.
    function parseJwt(token) {
      try {
        var base64Url = token.split('.')[1];
        var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
            return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));
        return JSON.parse(jsonPayload);
      } catch (e) {
        return null;
      }
    }

    // 페이지 로드 시 구글 로그인을 거치고 돌아왔는지 해시값 검사
    function checkLoginStatus() {
      const params = new URLSearchParams(window.location.hash.substring(1));
      const idToken = params.get('id_token');
      
      if (idToken) {
        const userData = parseJwt(idToken);
        if (userData) {
          currentUser = {
            uid: userData.sub,
            email: userData.email,
            name: userData.name || '익명 유저'
          };
          // 세션에 유저 저장
          sessionStorage.setItem('fortune_user', JSON.stringify(currentUser));
          // 해시 주소 깔끔하게 청소
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      } else {
        // 기존 세션이 있는지 확인
        const savedUser = sessionStorage.getItem('fortune_user');
        if (savedUser) {
          currentUser = JSON.parse(savedUser);
        }
      }

      updateUI();
    }

    function updateUI() {
      if (currentUser) {
        loginSection.classList.add('hidden');
        userSection.classList.remove('hidden');
        userDisplayName.textContent = `👋 ${currentUser.name}님`;
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ 오늘의 행운 뽑기';
      } else {
        loginSection.classList.remove('hidden');
        userSection.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = '🔒 로그인이 필요합니다';
        aiCard.style.display = 'none';
      }
    }

    // 🔒 외부 도메인 차단을 회피하는 정밀 구글 인증 연동 트리거
    loginBtn.addEventListener('click', () => {
      statusBox.textContent = "구글 인증 화면으로 이동 중...";
      
      // 내 현재 GitHub 주소를 자동으로 콜백 주소로 매칭합니다.
      const redirectUri = window.location.origin + window.location.pathname;
      
      // Firebase를 거치지 않는 구글 계정 직접 호출 주소 구성
      const googleAuthUrl = `https://accounts.google.com/o/oauth2/v2/auth?` +
        `client_id=578867439978-6npt0k20l9clgld605p7be5p0j13qf0o.apps.googleusercontent.com&` + // 구글 클라이언트 ID
        `redirect_uri=${encodeURIComponent(redirectUri)}&` +
        `response_type=id_token&` +
        `scope=openid%20email%20profile&` +
        `nonce=${Math.random().toString(36).substring(2)}`;
        
      window.location.href = googleAuthUrl;
    });

    logoutBtn.addEventListener('click', () => {
      sessionStorage.removeItem('fortune_user');
      currentUser = null;
      updateUI();
      statusBox.textContent = "로그아웃 되었습니다.";
    });

    // 운세 뽑기 진행 및 Realtime DB 데이터 인서트
    fortuneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      try {
        setLoading(true);
        aiCard.style.display = 'none';
        statusBox.textContent = '🔮 AI 점술가 럭키가 우주의 기운을 모으는 중...';

        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: "내 오늘의 행운 카드를 뽑아줘!" })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        const answerText = data.answer;
        aiText.textContent = answerText;
        aiCard.style.display = 'block';

        statusBox.textContent = '💾 Realtime Database에 운세 내역 기록 중...';
        
        // 📥 우회 로그인한 유저 정보를 가지고 실시간 데이터베이스에 직접 저장
        const fortunesRef = ref(database, 'fortunes');
        const newRecordRef = push(fortunesRef);
        
        await set(newRecordRef, {
          uid: currentUser.uid,
          email: currentUser.email,
          name: currentUser.name,
          fortuneResult: answerText,
          createdAt: new Date().toLocaleString()
        });

        statusBox.textContent = '🔮 오늘의 행운 뽑기 및 Realtime DB 저장 완료!';

      } catch (error) {
        console.error(error);
        aiText.textContent = '문제가 발생했습니다.\n원인: ' + error.message;
        aiCard.style.display = 'block';
        statusBox.textContent = '요청 실패';
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? '🔮 기운을 모으는 중...' : '✨ 오늘의 행운 뽑기';
    }

    ttsBtn.addEventListener('click', () => {
      const textToSpeak = aiText.textContent;
      if (!textToSpeak) return;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ko-KR';
      window.speechSynthesis.speak(utterance);
    });

    // 초기 실행
    checkLoginStatus();
  </script>
</body>
</html>
