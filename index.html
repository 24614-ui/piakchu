<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍀 행운 메이트 : 오늘의 행운 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #f3e5f5);
      font-family: Arial, sans-serif;
      color: #333;
    }
    .container {
      width: min(600px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 26px; color: #2b7a3a; }
    .subtitle { text-align: center; color: #777; margin-bottom: 24px; font-size: 14px; }
    
    /* 🔐 이메일 로그인/회원가입 구역 스타일 */
    .auth-box { background: #f9f9f9; padding: 18px; border-radius: 16px; text-align: left; margin-bottom: 20px; border: 1px solid #edf1f5; }
    .auth-input { width: 100%; padding: 10px; margin-top: 6px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .auth-input:focus { border-color: #4CAF50; }
    .btn-group { display: flex; gap: 10px; margin-top: 5px; }
    .login-btn { flex: 1; background-color: #4CAF50; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; text-align: center; }
    .login-btn:hover { background-color: #43a047; }
    .register-btn { flex: 1; background-color: #ffffff; color: #4CAF50; border: 1px solid #4CAF50; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; text-align: center; }
    .register-btn:hover { background-color: #f4fbf4; }
    
    .user-info { font-weight: bold; color: #2b7a3a; display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; }
    .logout-btn { background: #fff; border: 1px solid #ccc; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .logout-btn:hover { background: #f5f5f5; }

    .chat-box { display: flex; flex-direction: column; gap: 14px; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s;
    }
    .submit-btn:hover { transform: translateY(-2px); background-color: #43a047; }
    .submit-btn:disabled { cursor: not-allowed; opacity: 0.6; transform: none; background-color: #cccccc; }
    
    .ai-card {
      background: #fbf7ff;
      border-left: 5px solid #9C27B0;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #edf1f5;
      display: none;
    }
    .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed #e0e0e0; padding-bottom: 10px; }
    .card-title { margin: 0; font-size: 18px; color: #9C27B0; }
    .tts-btn { background-color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .ai-text { line-height: 1.8; font-size: 16px; margin: 0; white-space: pre-line; color: #444; }
    .status { min-height: 24px; color: #666; font-size: 13px; text-align: center; margin-top: 5px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍀 행운 메이트</h1>
    <div class="subtitle">이메일 로그인 후 오늘의 행운 카드를 뽑아보세요!</div>

    <div class="auth-box">
      <div id="login-section">
        <label style="font-size: 13px; font-weight: bold; color: #555;">📧 이메일 주소</label>
        <input type="email" id="auth-email" class="auth-input" placeholder="예: 24614@daehyun.hs.kr">
        
        <label style="font-size: 13px; font-weight: bold; color: #555;">🔑 비밀번호 (6자리 이상)</label>
        <input type="password" id="auth-password" class="auth-input" placeholder="비밀번호를 입력하세요">
        
        <div class="btn-group">
          <button id="email-login-btn" class="login-btn">로그인</button>
          <button id="email-register-btn" class="register-btn">회원가입</button>
        </div>
      </div>
      <div id="user-section" class="hidden">
        <div class="user-info">
          <div>
            <span id="user-display-email" style="display:block; font-size:15px;">👋 이메일 유저님 환영합니다!</span>
            <span style="display:block; font-size:12px; color:#666; font-weight:normal;">Firebase Authentication 연동 완료</span>
          </div>
          <button id="email-logout-btn" class="logout-btn">로그아웃</button>
        </div>
      </div>
    </div>

    <div class="chat-box">
      <form id="fortune-form">
        <button type="submit" id="submit-btn" class="submit-btn" disabled>🔒 로그인이 필요합니다</button>
      </form>

      <div id="status" class="status"></div>

      <section id="ai-card" class="card ai-card">
        <div class="ai-header">
          <h3 class="card-title">🔮 AI 점술가 럭키의 조언</h3>
          <button id="tts-btn" class="tts-btn">🔊 목소리로 듣기</button>
        </div>
        <p id="ai-text" class="ai-text"></p>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🎯 제공해주신 완벽한 파이어베이스 키셋 전원 배치 완료
    const firebaseConfig = {
      apiKey: "AIzaSyB88s6hnGZ08Gbe5NjX3buylytyPznSUY4",
      authDomain: "test-47ff6.firebaseapp.com",
      databaseURL: "https://test-47ff6-default-rtdb.firebaseio.com",
      projectId: "test-47ff6",
      storageBucket: "test-47ff6.firebasestorage.app",
      messagingSenderId: "578867439978",
      appId: "1:578867439978:web:b367473cc4d0cfced3dd13",
      measurementId: "G-605D2EZ8TW"
    };

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1zdR3hsVw8Xv0Tg02tTXCH5w_XXloYwWHpCNkS_iWcGELOP_eYaTpCfRAJjsrCh3T/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const loginSection = document.getElementById('login-section');
    const userSection = document.getElementById('user-section');
    const loginBtn = document.getElementById('email-login-btn');
    const registerBtn = document.getElementById('email-register-btn');
    const logoutBtn = document.getElementById('email-logout-btn');
    const emailInput = document.getElementById('auth-email');
    const passwordInput = document.getElementById('auth-password');
    const userDisplayEmail = document.getElementById('user-display-email');
    const fortuneForm = document.getElementById('fortune-form');
    const submitBtn = document.getElementById('submit-btn');
    const aiCard = document.getElementById('ai-card');
    const aiText = document.getElementById('ai-text');
    const statusBox = document.getElementById('status');
    const ttsBtn = document.getElementById('tts-btn');

    let globalUser = null;

    // 1. 🌟 Firebase Auth 실시간 로그인 상태 감지 엔진
    onAuthStateChanged(auth, (user) => {
      if (user) {
        globalUser = user;
        loginSection.classList.add('hidden');
        userSection.classList.remove('hidden');
        userDisplayEmail.textContent = `👋 ${user.email}님 환영합니다!`;
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ 오늘의 행운 뽑기';
      } else {
        globalUser = null;
        loginSection.classList.remove('hidden');
        userSection.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = '🔒 로그인이 필요합니다';
        aiCard.style.display = 'none';
      }
    });

    // 2. 📝 이메일 회원가입 기능 추가
    registerBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if(!email || !password) return alert("이메일과 비밀번호를 입력해주세요.");
      
      try {
        statusBox.textContent = "가입 승인 요청 중...";
        await createUserWithEmailAndPassword(auth, email, password);
        statusBox.textContent = "회원가입 및 로그인 성공!";
      } catch (error) {
        console.error(error);
        alert("회원가입 실패: " + error.message);
        statusBox.textContent = "회원가입 실패";
      }
    });

    // 3. 🔑 이메일 로그인 기능 추가
    loginBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if(!email || !password) return alert("이메일과 비밀번호를 입력해주세요.");

      try {
        statusBox.textContent = "인증 자격 검증 중...";
        await signInWithEmailAndPassword(auth, email, password);
        statusBox.textContent = "로그인 성공!";
      } catch (error) {
        console.error(error);
        alert("로그인 실패: " + error.message);
        statusBox.textContent = "로그인 실패";
      }
    });

    // 로그아웃
    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => {
        statusBox.textContent = "로그아웃 되었습니다.";
      });
    });

    // 4. 🔮 운세 뽑기 실행 (💥 에러 발생 시에도 무조건 DB 강제 백업 기록 탑재)
    fortuneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!globalUser) return;

      let finalFortuneResult = ""; 
      let isSuccess = true;

      try {
        setLoading(true);
        aiCard.style.display = 'none';
        statusBox.textContent = '🔮 AI 점술가 럭키가 우주의 기운을 모으는 중...';

        // OpenAI 트리거 전송
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ 
            question: "내 오늘의 행운 카드를 뽑아줘!",
            userName: globalUser.email.split('@')[0]
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        finalFortuneResult = data.answer || data.result;
        if (!finalFortuneResult) throw new Error("서버에서 온 답변 공백 오류");

        // 정상 출력
        aiText.textContent = finalFortuneResult;
        aiCard.style.display = 'block';
        statusBox.textContent = '💾 Realtime Database에 운세 결과 자동 기록 중...';

      } catch (error) {
        // 💥 에러 핸들링 필터 가동: 통신 오류나 GPT가 뻗어도 작동 유지!
        isSuccess = false;
        console.error("비상 에러 포착:", error);
        
        // 유저에게는 친절히 에러를 보여주고
        finalFortuneResult = `[시스템 에러 발생] 우주의 주파수가 불안정합니다.\n원인 요약: ${error.message}`;
        aiText.textContent = finalFortuneResult;
        aiCard.style.display = 'block';
        statusBox.textContent = '요청 중 문제 발생 (에러 상태 전송 중)';
      } finally {
        // 📥 [핵심] 성공/실패 여부를 떠나 Realtime Database에 무조건 강제 Insert 진행!
        try {
          const fortunesRef = ref(database, 'fortunes');
          const newRecordRef = push(fortunesRef);
          
          await set(newRecordRef, {
            uid: globalUser.uid,
            email: globalUser.email,
            fortuneResult: finalFortuneResult, // 정상 운세 내용 혹은 에러 코드가 그대로 저장됨
            status: isSuccess ? "SUCCESS" : "ERROR_BACKUP", 
            createdAt: new Date().toLocaleString()
          });

          if (isSuccess) {
            statusBox.textContent = '🔮 운세 뽑기 및 Realtime DB 저장 완료!';
          } else {
            statusBox.textContent = '⚠️ 운세 요청은 실패했으나 에러 내역이 DB에 백업되었습니다.';
          }
        } catch (dbError) {
          console.error("DB 자체 저장 에러:", dbError);
          statusBox.textContent = '데이터베이스 트래픽 초과 저장 실패';
        }
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? '🔮 기운을 모으는 중...' : '✨ 오늘의 행운 뽑기';
    }

    ttsBtn.addEventListener('click', () => {
      const textToSpeak = aiText.textContent;
      if (!textToSpeak) return;
      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ko-KR';
      window.speechSynthesis.speak(utterance);
    });

    checkLoginStatus();
  </script>
</body>
</html>
