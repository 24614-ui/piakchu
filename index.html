<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍀 행운 메이트 : 오늘의 행운 뽑기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #e8f5e9, #f3e5f5);
      font-family: Arial, sans-serif;
      color: #333;
    }
    .container {
      width: min(600px, 92%);
      margin: 40px auto;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
    }
    h1 { margin: 0 0 8px; text-align: center; font-size: 26px; color: #2b7a3a; }
    .subtitle { text-align: center; color: #777; margin-bottom: 24px; font-size: 14px; }
    
    /* 🔐 Firebase 로그인 구역 스타일 */
    .auth-box { background: #f9f9f9; padding: 18px; border-radius: 16px; text-align: center; margin-bottom: 20px; border: 1px solid #edf1f5; }
    .login-btn { background-color: #4285F4; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    .login-btn:hover { background-color: #357ae8; }
    .user-info { font-weight: bold; color: #2b7a3a; display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logout-btn { background: #fff; border: 1px solid #ccc; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
    .logout-btn:hover { background: #f5f5f5; }

    .chat-box { display: flex; flex-direction: column; gap: 14px; }
    .submit-btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      background-color: #4CAF50;
      color: #fff;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.15s;
    }
    .submit-btn:hover { transform: translateY(-2px); background-color: #43a047; }
    .submit-btn:disabled { cursor: not-allowed; opacity: 0.6; transform: none; background-color: #cccccc; }
    
    .ai-card {
      background: #fbf7ff;
      border-left: 5px solid #9C27B0;
      padding: 20px;
      border-radius: 16px;
      border: 1px solid #edf1f5;
      border-left: 5px solid #9C27B0;
      display: none;
    }
    .ai-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px dashed #e0e0e0; padding-bottom: 10px; }
    .card-title { margin: 0; font-size: 18px; color: #9C27B0; }
    .tts-btn { background-color: #e2e8f0; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; }
    .ai-text { line-height: 1.8; font-size: 16px; margin: 0; white-space: pre-line; color: #444; }
    .status { min-height: 24px; color: #666; font-size: 13px; text-align: center; margin-top: 5px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🍀 행운 메이트</h1>
    <div class="subtitle">구글 로그인 후 오늘의 행운 카드를 뽑아보세요!</div>

    <div class="auth-box">
      <div id="login-section">
        <p style="margin: 0 0 12px 0; font-size: 14px; color: #555;">로그인하시면 나만의 운세 기록이 Realtime DB에 보관됩니다.</p>
        <button id="firebase-login-btn" class="login-btn">🌐 구글 계정으로 로그인</button>
      </div>
      <div id="user-section" class="hidden">
        <div class="user-info">
          <span id="user-display-name">👋 인증 확인 중...</span>
          <button id="firebase-logout-btn" class="logout-btn">로그아웃</button>
        </div>
      </div>
    </div>

    <div class="chat-box">
      <form id="fortune-form">
        <button type="submit" id="submit-btn" class="submit-btn" disabled>🔒 로그인이 필요합니다</button>
      </form>

      <div id="status" class="status"></div>

      <section id="ai-card" class="card ai-card">
        <div class="ai-header">
          <h3 class="card-title">🔮 AI 점술가 럭키의 조언</h3>
          <button id="tts-btn" class="tts-btn">🔊 목소리로 듣기</button>
        </div>
        <p id="ai-text" class="ai-text"></p>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔴 알려주신 본인의 실제 Firebase API 정보 완벽 적용
    const firebaseConfig = {
      apiKey: "AIzaSyB88s6hnGZ08Gbe5NjX3buylytyPznSUY4",
      authDomain: "test-47ff6.firebaseapp.com",
      databaseURL: "https://test-47ff6-default-rtdb.firebaseio.com",
      projectId: "test-47ff6",
      storageBucket: "test-47ff6.firebasestorage.app",
      messagingSenderId: "578867439978",
      appId: "1:578867439978:web:b367473cc4d0cfced3dd13",
      measurementId: "G-605D2EZ8TW"
    };

    // ⚠️ [주소 확인] 내 OpenAI 전송용 구글 앱스 스크립트 주소
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw1zdR3hsVw8Xv0Tg02tTXCH5w_XXloYwWHpCNkS_iWcGELOP_eYaTpCfRAJjsrCh3T/exec';

    // Firebase 가동
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // DOM 노드 연결
    const loginSection = document.getElementById('login-section');
    const userSection = document.getElementById('user-section');
    const loginBtn = document.getElementById('firebase-login-btn');
    const logoutBtn = document.getElementById('firebase-logout-btn');
    const userDisplayName = document.getElementById('user-display-name');
    const fortuneForm = document.getElementById('fortune-form');
    const submitBtn = document.getElementById('submit-btn');
    const aiCard = document.getElementById('ai-card');
    const aiText = document.getElementById('ai-text');
    const statusBox = document.getElementById('status');
    const ttsBtn = document.getElementById('tts-btn');

    let globalUser = null;

    // 1. 🌟 로그인 상태 실시간 변화 추적 감지기
    onAuthStateChanged(auth, (user) => {
      if (user) {
        globalUser = user;
        loginSection.classList.add('hidden');
        userSection.classList.remove('hidden');
        userDisplayName.textContent = `👋 ${user.displayName || user.email.split('@')[0]}님`;
        submitBtn.disabled = false;
        submitBtn.textContent = '✨ 오늘의 행운 뽑기';
      } else {
        globalUser = null;
        loginSection.classList.remove('hidden');
        userSection.classList.add('hidden');
        submitBtn.disabled = true;
        submitBtn.textContent = '🔒 로그인이 필요합니다';
        aiCard.style.display = 'none';
      }
    });

    // 2. 🔐 버그 없는 리다이렉트 기반 로그인 트리거
    loginBtn.addEventListener('click', () => {
      statusBox.textContent = "구글 로그인 페이지로 안전하게 이동 중...";
      signInWithRedirect(auth, provider);
    });

    // 로그아웃 처리
    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => { 
        statusBox.textContent = "안전하게 로그아웃 되었습니다."; 
      });
    });

    // 구글 로그인을 마친 후 페이지가 복귀했을 때 결과 수신 처리 (알잘딱 내부 처리)
    getRedirectResult(auth)
      .then((result) => {
        if (result && result.user) {
          statusBox.textContent = "인증 완료! 반가워요.";
        }
      })
      .catch((error) => {
        console.error("인증 에러:", error);
        statusBox.textContent = "로그인 도중 에러가 발생했습니다: " + error.message;
      });

    // 3. 운세 버튼 클릭 시 구글 서버 경유 후 Realtime DB 다이렉트 보관
    fortuneForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!globalUser) return;

      try {
        setLoading(true);
        aiCard.style.display = 'none';
        statusBox.textContent = '🔮 AI 점술가 럭키가 우주의 기운을 모으는 중...';

        // 구글 서버로 단순 퀘스천 전송 (OpenAI 결과 반환용)
        const response = await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ question: "내 오늘의 행운 카드를 뽑아줘!" })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        const answerText = data.answer;
        aiText.textContent = answerText;
        aiCard.style.display = 'block';

        // 💾 [실시간 저장] Firebase Realtime Database 'fortunes' 경로에 유저 정보와 결과 타격
        statusBox.textContent = '💾 Realtime Database에 운세 내역 기록 중...';
        
        const fortunesRef = ref(database, 'fortunes');
        const newRecordRef = push(fortunesRef); // 유니크 키 자동생성
        
        await set(newRecordRef, {
          uid: globalUser.uid,
          email: globalUser.email,
          name: globalUser.displayName || '익명 유저',
          fortuneResult: answerText,
          createdAt: new Date().toLocaleString()
        });

        statusBox.textContent = '🔮 오늘의 행운 뽑기 및 Realtime DB 저장 완료!';

      } catch (error) {
        console.error(error);
        aiText.textContent = '우주의 주파수가 불안정합니다.\n원인: ' + error.message;
        aiCard.style.display = 'block';
        statusBox.textContent = '요청 실패';
      } finally {
        setLoading(false);
      }
    });

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      submitBtn.textContent = isLoading ? '🔮 기운을 모으는 중...' : '✨ 오늘의 행운 뽑기';
    }

    // TTS 오디오 출력 기능
    ttsBtn.addEventListener('click', () => {
      const textToSpeak = aiText.textContent;
      if (!textToSpeak) return;

      const utterance = new SpeechSynthesisUtterance(textToSpeak);
      utterance.lang = 'ko-KR';
      utterance.rate = 1.0;
      window.speechSynthesis.speak(utterance);
    });
  </script>
</body>
</html>
